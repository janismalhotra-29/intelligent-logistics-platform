services:
  db:
    image: postgis/postgis:16-3.4
    container_name: ner_postgis_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ner_logistics}
      POSTGRES_USER: ${POSTGRES_USER:-ner_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ner_secure_password_placeholder}
    ports:
      # Bind to localhost only to prevent public exposure
      - "127.0.0.1:5432:5432"
    volumes:
      - postgis_data:/var/lib/postgresql/data
      - ./database/migrations/001_init_postgis.sql:/docker-entrypoint-initdb.d/001_init_postgis.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ner_admin} -d ${POSTGRES_DB:-ner_logistics}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: ner_backend
    restart: unless-stopped
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-ner_admin}:${POSTGRES_PASSWORD:-ner_secure_password_placeholder}@db:5432/${POSTGRES_DB:-ner_logistics}
      - ENVIRONMENT=${ENVIRONMENT:-production}
      - PORT=8000
      - ADMIN_API_KEY=${ADMIN_API_KEY:-ner_admin_dev_key_2026}
      - FRONTEND_ORIGINS=${FRONTEND_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ner_frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  postgis_data:
